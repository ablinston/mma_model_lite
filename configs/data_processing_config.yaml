# Set whether to impute missing values of betfair with best_closing_odds
impute_missing_betfair: True

# Set the suffix of what odds to use when calculating true odds
odds_suffix_for_true_odds: betfair_exch_odds

# Set which odds should be used for the upcoming fights only # betfair_exch_odds or best_closing_odds
upcoming_odds_suffix_for_true_odds: betfair_exch_odds

# Set which odds to use for base margin in modelling (i.e. which odds to use when modelling a delta to odds rather than direct probs of winning)
# Should generally just be whatever is used for backtesting. This will be calculated after the backtesting columns
odds_suffix_for_base_margin: backtesting_odds

# Set whether to impute odds where we have one fighter's odds but for some reason the odds scrape has missing for the other fighter
impute_one_sided_missing_odds: True

# Set whether to add the bayes versions of columns
add_bayes_percentage_columns: True
add_bayes_per_minute_columns: False

## Bayes figures

# Set whether to use fixed Bayesian priors across all fights ever. If True, this will choose the Bayesian priors from a single date (and ignore groupby) and just apply those to every fight both
# past and present.
constant_bayes_priors: True
constant_bayes_priors_date: 2018-01-01

# Set how many past fights to use to calculate the bayesian priors. Not this will be per group if chosen to groupby. For reference, in 2016, there were 490 fights
bayes_fightspan: 1000

# Set the number of observations to equalise the priors to in bayes stats calcs. Effectively how many minutes/attemps the priors count for compared to the fighter's own stats. alpha plus beta in the formula will then always be set to this and alpha recalculated with this as a base
bayes_alpha_plus_beta_rebase_percent: 75
bayes_alpha_plus_beta_rebase_per_minute: 5

# Bayesian group by. This is what we group the Bayesian smooting of stats by
bayesian_groupby: [] # ['weightclass'] Tested using weightclass but features less predictive power after

# Set whether to add adjusted stats as well as raw (requires bayes stats for the bayes adj columns)
add_adj_per_minute_columns: False
add_adj_percentage_columns: False
add_adj_per_minute_bayes_columns: False
add_adj_percentage_bayes_columns: False