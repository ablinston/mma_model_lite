# Set which version of the model to use for predicting upcoming fights
model_to_use: './models/xgb_forest_v4.1.0.joblib'

# Set the minimum values to trigger a bet when predicting upcoming events. Works as strictly greater than
min_prob_to_bet: 0.25
min_ev_to_bet: 0.1

# Only place a bet when the model picks the same winner as the market does. False lets a value bet
# go on an underdog the model rates below its opponent, which is what happens at a low min_prob_to_bet
only_bet_when_model_and_odds_agree: False

# Set either constant bets or proportion bets
constant_bets: False
min_bet_size: 0.05
max_bet_size: 0.05

# Starting balance when sizing bets
start_balance: 3290.70

# Set the commission the exchange will charge on winnings
exchange_commission: 0.02

# The bookmakers to check odds at on oddschecker. Matching ignores case and spaces, so 'Bet Victor'
# and 'BetVictor' both find the same one, but the rest of the spelling has to match oddschecker's own
# name for it. Betfair here means the exchange, oddschecker lists Betfair Sportsbook separately.
# Commission only comes off the exchanges, and which ones those are comes from oddschecker itself
# rather than from this list.
bookies_to_use:
  - bet365
  - Betfair
  - Betway
  - William Hill
  - BetVictor
  - Smarkets
  - Betfred
  - BetGoodwin
  - 10bet
  - Paddy Power
  - PricedUp
  - Matchbook
  - Coral
