# This sets whether the fighters be swapped so that the odds favourite is always fighter1
switch_fighters_with_odds: False

# This sets whether the fighters should be randomly switched before models are fit
# Note that if this is true it effectively undoes the switch with odds
switch_fighters_randomly: True

# Set whether we include differential features only in the model features
differential_features_only: False

# Set which loss function to use. mlogloss is the most common, but ev_loss_function is the custom one I made
loss_function: ev_loss_function

# Set whether to add some random noise to the odds as part of the XGB forest. This will be based on a fixed distribution
add_noise_to_odds: True