
# Set whether to switch all fights and add to date, essentially doubling it. If True, the other switch fighters options are ignored
switch_all_fighters_and_stack: False

# This sets whether the fighters be swapped so that the odds favourite is always fighter1
switch_fighters_with_odds: False

# This sets whether the fighters should be randomly switched before models are fit
# Note that if this is true it effectively undoes the switch with odds
switch_fighters_randomly: True

# Set whether to exclude split decisions and other from training data (this won't be applied to test data)
# split_or_other_exclude: False # Now a variable hyperparameter in hyperopt

# Set whether we include differential features only in the model features
differential_features_only: False

# Set which loss function to use. mlogloss is the most common, but ev_loss_function is the custom one I made
loss_function: logloss

# Set whether to add some random noise to the odds as part of the XGB forest. This will be based on a fixed distribution. Should really only use true odds in model when doing this as strange things can happen
add_noise_to_odds: False
# Set the standard deviation of the normaly distributed noise to be added
# odds_noise_mean: 0.96123
odds_noise_standard_dev: 0.05177 # From odds testing script

# Set whether to use only the true odds in modelling or if we should use underlying odds too
true_odds_only: True

# Set whether to exclude all but open odds
open_odds_only: False

# Set whether to use the mean_closing_odds or best_closing_odds in the backtesting i.e. to derive _backtesting_odds features.
odds_to_use: betfair_exch_odds

# Set whether to trim model features to try to remove duplicated similar but slightly different features. Just keep the highest importance version
trim_model_features: False

# Set whether to use bootstrapping and bagging on the training data, or just use the training dataset. If enabled, the model will take the subsample and increase the sample size back to the original dataset through bootstrapping
xgb_forest_bagging: True

# These are the odds columns that will be used as base margin for each of the outcomes. They should be in the same order as the outcome labels. 
# To asign a flat % probability, input a dictionary such as {'flat_prob': 0.01}. 
# To not use any, input Null.
# e.g.s Null or ['notformodel_lw_base_margin', {'flat_prob': 0.0183}, 'notformodel_wl_base_margin'] 
base_margin_cols: Null #['notformodel_lw_base_margin', {'flat_prob': 0.05}, 'notformodel_wl_base_margin'] 